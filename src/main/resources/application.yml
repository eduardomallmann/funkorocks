# Basic application info
info:
  app:
    name: ShoppingCart Backend
    description: Backend service in spring-boot for the Funko Rocks ShoppingCart App.
    version: 0.0.1

# Spring configuration
spring:
  application:
    name: shoppingcart-backend
  # Database configuration
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  # Configuring spring session
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 30m

# Server configuration
server:
  port: 8080
  servlet:
  # Configuring server session timeout
    session:
      timeout: 7m