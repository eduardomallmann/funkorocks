# Basic application info
info:
  app:
    name: ShoppingCart Backend
    description: Backend service in spring-boot for the Funko Rocks ShoppingCart App.
    version: 0.0.1

# Spring configuration
spring:
  application:
    name: shoppingcart-backend
  # Database configuration
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  # JPA configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  # Configuring spring session
  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
    timeout: 30m
    cookie:
      name: JSESSIONID
      http-only: true
      secure: false  # Set to true in production
      same-site: lax
  
  # Security configuration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/funkorocks
      client:
        provider:
          keycloak:
            issuer-uri: http://localhost:8081/realms/funkorocks
            user-name-attribute: preferred_username
        registration:
          keycloak:
            client-id: shoppingcart-service
            client-secret: ${KEYCLOAK_CLIENT_SECRET:shoppingcart-secret-2024}
            scope: openid,profile,email,roles,funkorocks.read,funkorocks.write
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8080/login/oauth2/code/keycloak

# Server configuration
server:
  port: 8080
  servlet:
  # Configuring server session timeout
    session:
      timeout: 7m