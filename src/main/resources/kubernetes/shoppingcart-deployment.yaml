apiVersion: apps/v1
kind: Deployment
metadata:
  name: shoppingcart
  labels:
    app: shoppingcart
    version: 0.0.2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shoppingcart
  template:
    metadata:
      labels:
        app: shoppingcart
        version: 0.0.2
    spec:
      containers:
        - name: shoppingcart-backend
          image: eduardomallmann/funkorocks/backend:0.0.2
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: client-secret
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
              initialDelaySeconds: 60
              periodSeconds: 10
              timeoutSeconds: 3
              failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
              initialDelaySeconds: 30
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"